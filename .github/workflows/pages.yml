name: Deploy to Pages

# 저장소 루트를 통째로 서빙하지 않는다. scripts/build_site.py 가 data/tools.json 의
# public 필드를 읽어 공개할 것만 _site/ 로 모으고, 그 결과만 배포한다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것이 먼저 끝나 예전 사이트가 올라갈 수 있다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # 깨진 사이트를 배포하지 않도록 빌드 전에 막는다.
      - name: Validate static site
        run: python3 scripts/validate_site.py
      - name: Build publishable site
        run: python3 scripts/build_site.py --manifest
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
