name: Validate site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate static site
        run: python3 scripts/validate_site.py
      # 파일을 하나씩 적으면 새 테스트를 추가하고 여기 넣는 걸 잊는다.
      - name: Run every node test
        run: |
          for file in scripts/test_*.js; do
            echo "── $file"
            node "$file" || exit 1
          done
