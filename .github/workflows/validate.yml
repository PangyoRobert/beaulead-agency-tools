name: Validate site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate static site
        run: python3 scripts/validate_site.py
      - name: Test development quote rules
        run: node scripts/test_development_quote.js
      - name: Test Google Ads training quote rules
        run: node scripts/test_google_ads_training_quote.js
