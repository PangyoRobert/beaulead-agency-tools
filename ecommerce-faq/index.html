:root{color-scheme:light;--bg:var(--bl-surface-raised);--panel:var(--bl-surface-default);--ink:var(--bl-text-default);--muted:var(--bl-text-body-on-light);--line:var(--bl-rule-on-light);--brand:var(--bl-brand-accent)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:24px}
body{margin:0;min-width:320px;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.6}
a{color:inherit}

header{background:var(--bl-surface-inverse);color:var(--bl-text-inverse);padding:20px 5vw;display:flex;justify-content:space-between;gap:16px}
header a{color:inherit;text-decoration:none;font-weight:800;letter-spacing:.06em}
header .back{color:var(--bl-on-dark-body);font-weight:600;font-size:14px}
main{max-width:880px;margin:auto;padding:52px 28px 80px}
.eyebrow{font-size:12px;letter-spacing:.15em;font-weight:800;color:var(--brand)}
h1{font-size:clamp(32px,4.6vw,52px);letter-spacing:-.05em;line-height:1.12;margin:14px 0 18px}
.lead{max-width:680px;font-size:16px;color:var(--muted);word-break:keep-all}
.notice{margin:24px 0 8px;border-left:4px solid var(--brand);background:var(--panel);padding:18px 22px;font-size:13px;word-break:keep-all}
.notice strong{display:block;margin-bottom:6px;font-size:14px}
.notice ul{margin:8px 0 0;padding-left:18px}
.notice li{margin-bottom:5px}
.faq{margin-top:28px;display:grid;gap:12px}
details{border:1px solid var(--line);background:var(--panel);border-radius:14px;overflow:hidden}
summary{cursor:pointer;list-style:none;padding:18px 22px;font-size:17px;font-weight:700;letter-spacing:-.02em;display:flex;gap:14px;align-items:flex-start;word-break:keep-all}
summary::-webkit-details-marker{display:none}
summary .no{flex:none;color:var(--brand);font-weight:800;font-variant-numeric:tabular-nums}
summary::after{content:"+";margin-left:auto;flex:none;color:var(--muted);font-size:20px;line-height:1.2}
details[open] summary::after{content:"−"}
.body{padding:0 22px 20px 58px;font-size:15px;word-break:keep-all}
.body p{margin:0 0 10px}
.tag{display:inline-block;margin:0 0 12px;padding:3px 10px;font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:999px;background:var(--bl-surface-raised);color:var(--ink)}
.checks{margin:14px 0 0;padding:14px 16px;border-radius:10px;background:var(--bl-surface-raised);font-size:14px}
.checks h3{margin:0 0 6px;font-size:13px;letter-spacing:.04em}
.checks ul{margin:0;padding-left:18px}
.checks li{margin-bottom:4px}
.sources{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.sources h2{margin:0 0 8px;font-size:14px;color:var(--ink)}
.sources ul{margin:0;padding-left:18px}
.foot{margin-top:24px;color:var(--muted);font-size:12px;line-height:1.7}
@media(max-width:640px){main{padding:36px 18px}header{padding:16px}.body{padding:0 18px 18px}summary{padding:16px 18px;font-size:16px}}

<body>
<header><a href="../">BEAULEAD ↗</a><span class="back"><a href="../#tools">← 전체 도구</a></span></header>
<main>
<div class="eyebrow">E-COMMERCE FAQ</div>
<h1>자사몰과 네이버 쇼핑<br>자주 묻는 질문</h1>
<p class="lead">자사몰이 네이버 쇼핑에 보이지 않을 때 인하우스 마케터가 가장 먼저 묻는 질문과, 답을 정하기 전에 확인할 점검 순서를 정리했습니다.</p>

<div class="notice" id="notice"><strong>읽기 전에 확인해 주세요</strong><ul id="notice-list"></ul></div>

<div class="faq" id="faq"></div>

<section class="sources"><h2>참고한 자료</h2><ul id="sources"></ul></section>
<p class="foot" id="foot"></p>
</main>
<script src="./faq-config.js"></script>
<script>
(function () {
  const CONFIG = window.ECOMMERCE_FAQ_CONFIG;
  function el(tag, props, children) {
    const node = document.createElement(tag);
    Object.entries(props || {}).forEach(([key, value]) => {
      if (key === "text") node.textContent = value;
      else if (key === "class") node.className = value;
      else node.setAttribute(key, value);
    });
    (children || []).forEach((child) => child && node.append(child));
    return node;
  }

  const noticeList = document.getElementById("notice-list");
  CONFIG.notice.forEach((text) => noticeList.append(el("li", { text })));

  const faq = document.getElementById("faq");
  CONFIG.items.forEach((item, index) => {
    const body = el("div", { class: "body" }, [
      el("span", { class: "tag", text: "신뢰도: " + CONFIG.levels[item.level] })
    ]);
    item.answer.forEach((text) => body.append(el("p", { text })));
    const checks = el("div", { class: "checks" }, [el("h3", { text: "확인할 것" })]);
    const list = el("ul");
    item.checks.forEach((text) => list.append(el("li", { text })));
    checks.append(list);
    body.append(checks);
    const summary = el("summary", {}, [
      el("span", { class: "no", text: "Q" + (index + 1) }),
      el("span", { text: item.q })
    ]);
    const details = el("details", { id: item.id }, [summary, body]);
    if (index === 0) details.open = true;
    faq.append(details);
  });

  const sources = document.getElementById("sources");
  CONFIG.sources.forEach((s) => {
    sources.append(el("li", {}, [el("a", { href: s.url, target: "_blank", rel: "noopener noreferrer", text: s.label })]));
  });
  document.getElementById("foot").textContent = "기준일 " + CONFIG.updatedAt + ". 문의는 robert@beaulead.co.kr로 주십시오.";
})();
</script>
</body>
