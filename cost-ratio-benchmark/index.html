    <p class="intro">매출액 대비 매출원가 비율(매출원가 ÷ 매출액 × 100)을 한국은행 기업경영분석 공식 통계로 정리했습니다. 원가의 뜻이 다른 업종끼리는 섞지 않도록 원가 기준별로 나눠 보여 줍니다. 아래 주의사항을 먼저 읽어 주세요.</p>

  <script>
    (function renderPage() {
      const CONFIG = window.COST_RATIO_CONFIG;
      const DATA = window.COST_RATIO_DATA;

      // 텍스트는 textContent 로만 그린다.
      function element(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }
      function pct(v) { return typeof v === "number" ? v.toFixed(2) + "%" : "—"; }

      const years = DATA.source.years;
      const latest = years[years.length - 1];

      // ── 출처 ──
      const source = document.getElementById("source");
      [
        ["통계", DATA.source.publisher + " (승인통계)"],
        ["지표", "매출원가 대 매출액 = 매출원가 ÷ 매출액 × 100"],
        ["기준 연도", latest + "년 (최근 " + years.length + "년 추이 " + years[0] + "~" + latest + ")"],
        ["대상", "국내 비금융 영리법인(법인세 신고 기준), 개인사업자 제외"],
        ["원가 구성", "제조원가명세서(" + DATA.compositionSource.year + "년, 당기총제조비용 = 재료비 + 노무비 + 경비)"],
        ["값을 받은 날", DATA.source.fetchedAt]
      ].forEach(function (pair) { source.append(element("dt", null, pair[0]), element("dd", null, pair[1])); });

      // ── 주의사항 (전부 병기) ──
      const caveats = document.getElementById("caveats");
      CONFIG.caveats.forEach(function (c) {
        const box = element("div", "panel");
        box.append(element("h3", null, c.title));
        const ul = element("ul");
        c.items.forEach(function (item) {
          if (typeof item === "string") { ul.append(element("li", null, item)); return; }
          const li = element("li", null, item.text);
          const sub = element("ul");
          item.sub.forEach(function (s) { sub.append(element("li", null, s)); });
          li.append(sub); ul.append(li);
        });
        box.append(ul);
        caveats.append(box);
      });

      // ── 업종별 표 (원가 기준별로 나눔) ──
      const groups = document.getElementById("groups");
      CONFIG.groups.forEach(function (g) {
        const wrap = element("div", "group panel");
        wrap.append(element("h3", null, g.title), element("span", "basis", g.basis), element("p", "group-note", g.note));
        const table = element("table");
        const thead = element("thead"); const hr = element("tr");
        const sizeHeads = CONFIG.sizes.map(function (s) { return latest + " " + s.label; });
        const extraHeads = g.showMaterialRatio ? [latest + " 재료비율 (매출 대비)"] : [];
        const heads = ["업종"].concat(sizeHeads, extraHeads, years.map(function (y) { return y + " 전체"; }));
        heads.forEach(function (h, i) { const th = element("th", i ? "num" : null, h); th.setAttribute("scope", "col"); hr.append(th); });
        thead.append(hr);
        const tbody = element("tbody");
        g.industries.forEach(function (ind) {
          const v = DATA.values[ind.code];
          const tr = element("tr");
          const name = element("th");
          name.setAttribute("scope", "row");
          name.append(element("span", null, (ind.parent ? "└ " : "") + ind.name), element("span", "code", ind.code));
          if (ind.flag) name.append(element("span", "flag", ind.flag));
          tr.append(name);
          CONFIG.sizes.forEach(function (s, i) {
            const series = v[s.code];
            const val = series ? series[latest] : null;
            tr.append(element("td", "num" + (i === 0 ? " main" : "") + (val === null ? " na" : ""), pct(val)));
          });
          if (g.showMaterialRatio) tr.append(element("td", "num", pct(DATA.materialToSales[ind.code])));
          years.forEach(function (y) {
            const val = v.A ? v.A[y] : null;
            tr.append(element("td", "num" + (val === null ? " na" : ""), pct(val)));
          });
          tbody.append(tr);
        });
        table.append(thead, tbody);
        const scroller = element("div", "table-wrap"); scroller.append(table);
        wrap.append(scroller);
        groups.append(wrap);
      });

      // ── 제조원가 구성 (공장 원가 = 100). 금액은 데이터 원본(백만원), 비중은 여기서 계산한다. ──
      const comp = CONFIG.composition;
      const manufacturing = CONFIG.groups.find(function (g) { return g.showMaterialRatio; });
      document.getElementById("comp-note").textContent = comp.note;
      function parts(c) {
        return {
          materials: c.materials, labor: c.labor, depreciation: c.depreciation, outsourcing: c.outsourcing,
          energy: c.electricity + c.gasWater,
          otherOverhead: c.overhead - c.depreciation - c.outsourcing - c.electricity - c.gasWater
        };
      }
      const compTable = document.getElementById("comp-table");
      const chead = element("thead"); const chr = element("tr");
      ["업종"].concat(comp.columns.map(function (col) { return col.label; })).forEach(function (h, i) {
        const th = element("th", i ? "num" : null, h); th.setAttribute("scope", "col"); chr.append(th);
      });
      chead.append(chr);
      const cbody = element("tbody");
      manufacturing.industries.forEach(function (ind) {
        const c = DATA.composition[ind.code];
        const p = parts(c);
        const tr = element("tr");
        const name = element("th"); name.setAttribute("scope", "row");
        name.append(element("span", null, (ind.parent ? "└ " : "") + ind.name), element("span", "code", ind.code));
        tr.append(name);
        comp.columns.forEach(function (col) {
          const share = p[col.key] / c.totalManufacturingCost * 100;
          const td = element("td", "num bar-cell");
          td.setAttribute("title", ind.name + " · " + col.label + " " + share.toFixed(1) + "% (공장 원가 대비)");
          const track = element("span", "bar-track"); track.setAttribute("aria-hidden", "true");
          const fill = element("span", "bar-fill");
          fill.style.width = Math.max(0, Math.min(100, share)).toFixed(1) + "%";
          track.append(fill);
          td.append(element("span", "val", share.toFixed(1) + "%"), track);
          tr.append(td);
        });
        cbody.append(tr);
      });
      compTable.append(chead, cbody);
      const legend = document.getElementById("comp-legend");
      legend.append(element("span", null, "막대 길이 = 그 항목이 공장 원가에서 차지하는 비중(%). 항목 설명: "));
      comp.columns.forEach(function (col, i) {
        legend.append(element("b", null, col.label), element("span", null, " " + col.desc + (i < comp.columns.length - 1 ? " · " : ".")));
      });

      document.getElementById("footnote").textContent = CONFIG.footnote + " '—'는 공식 통계에서 해당 기업 규모의 값을 제공하지 않는 칸입니다.";
    })();
  </script>
