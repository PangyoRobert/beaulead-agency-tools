.notice{display:none;margin-top:9px;border-left:3px solid var(--yellow);background:rgba(241,194,27,.15);color:var(--ink);border-radius:3px 10px 10px 3px;padding:10px 11px;font-size:12px;line-height:1.5}.notice.show{display:block}.div{height:1px;background:var(--line);margin:28px 0}
.options{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.opt{border:1px solid var(--line);border-radius:13px;padding:12px;min-height:88px;background:var(--surface);display:flex;flex-direction:column;justify-content:space-between}.optTop{display:flex;justify-content:space-between;gap:8px}.optName{font-size:13px;font-weight:700}.optPrice{font-size:11px;color:var(--muted);margin-top:5px}.switch{appearance:none;-webkit-appearance:none;border:0;padding:0;width:38px;height:22px;border-radius:999px;background:var(--bl-text-muted);position:relative;cursor:pointer;flex:none}.switch:after{content:"";width:18px;height:18px;background:var(--bl-surface-default);border-radius:50%;position:absolute;top:2px;left:2px;transition:.15s}.switch.on{background:var(--brand)}.switch.on:after{left:18px}.switch:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.mini{display:none;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}.mini.show{display:flex}.mini span{font-size:11px;color:var(--muted)}.mini input{width:65px;border:1px solid var(--line);border-radius:8px;padding:6px;color:var(--ink);background:var(--surface);font-size:12px;text-align:right}.mini input:focus-visible{outline:2px solid var(--blue);outline-offset:1px}

.lines{border-bottom:1px solid var(--line);padding:5px 0 12px}.line{display:flex;justify-content:space-between;gap:14px;padding:7px 0;font-size:13px}.line span:first-child{color:var(--muted)}.line strong{font-variant-numeric:tabular-nums;white-space:nowrap}.disc strong{color:var(--ink)}.totals{padding-top:11px}.totals .line{font-size:14px}.totals .grand{font-size:17px;padding-top:14px;border-top:1px solid var(--line);margin-top:7px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.btn{min-height:48px;border:1px solid var(--line);border-radius:11px;padding:11px;font-size:14px;font-weight:700;cursor:pointer}.primary{border-color:var(--brand);background:var(--brand);color:var(--bl-text-inverse)}.secondary{background:var(--surface);color:var(--ink)}.btn:hover{filter:brightness(1.08)}.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.foot{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:11px}

@media(max-width:1050px){.grid{grid-template-columns:1fr}.right{position:static}.services{grid-template-columns:1fr}.options{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.wrap{width:min(100% - 24px,1440px);padding-top:28px}.top{flex-direction:column;align-items:flex-start}.chips{justify-content:flex-start}.fields,.options{grid-template-columns:1fr}.right{padding:22px}.hero{margin-inline:-22px;padding-inline:22px}.actions{grid-template-columns:1fr}.foot{display:grid;gap:4px}.page-title{align-items:flex-start}.mark{width:42px;height:42px;flex:none}.page-title small{font-size:13px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition-duration:.01ms!important}}

/* 인쇄·PDF. 하드코딩된 rgba 배경까지 한 번에 걷어내되 폼 컨트롤은 제외한다
   (배경·색을 덮으면 체크 여부가 종이에서 안 읽힌다).
   색은 brand-design-system tokens.json 확정값. */
@media print{@page{margin:14mm}:root{color-scheme:light}*:not(input):not(select):not(textarea):not(option),*:before,*:after{background:transparent!important;color:#241815!important;border-color:#E0E0E0!important;box-shadow:none!important;text-shadow:none!important}input:not([type=checkbox]):not([type=radio]):not([type=range]){color:#241815!important;background:#FFFFFF!important;border-color:#E0E0E0!important}html,body{background:#FFFFFF!important}body{min-width:0}.topbar,.back,.toast,.actions,.foot,input[type=range],.range{display:none!important}.wrap{width:100%;padding:0}.top{display:block}.chips{justify-content:flex-start;margin-top:12px}.grid{display:block}.panel{border:1px solid #E0E0E0!important;border-radius:0;break-inside:avoid}.right{position:static!important;margin-top:16px}.svc,.opt,.field,.chip,.seg button,.approval,.notice{border:1px solid #E0E0E0!important}.mark{border:1px solid #0F62FE!important;color:#0F62FE!important}.switch{border:1px solid #E0E0E0!important}.switch.on,.switch.on:after{background:#0F62FE!important}.seg .on{border-color:#0F62FE!important;color:#0F62FE!important}.price,.amount,.status,.qty,.disc strong{color:#0F62FE!important}/* 고르지 않은 옵션은 종이에서 소음이다. :has 미지원 브라우저는 전부 인쇄된다. */.opt:not(:has(.switch.on)){display:none}}

<body>
<header class="topbar">
  <a class="brand-link" href="../">BEAULEAD</a>
  <a class="back" href="../#tools">← Agency Tools</a>
</header>
<div class="wrap">
  <div class="top">
    <div class="page-title"><div class="mark">B</div><div><h1>영상 제작 간편 견적</h1><small id="subtitle"></small></div></div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="grid">
    <section class="panel left">
      <div class="head"><h2>견적 조건</h2><p>토글·드래그 시 실시간 재계산</p></div>
      <div class="fields">
        <div class="field"><label for="f-client">고객사</label><input id="f-client"></div>
        <div class="field"><label for="f-inquiry">문의 유형</label><input id="f-inquiry"></div>
        <div class="field"><label for="f-stage">상태</label><input id="f-stage" readonly></div>
      </div>

      <div class="services" id="services"></div>

      <div class="div"></div>
      <div class="head"><h2>추가 옵션</h2><p>옵션 단가표 기준 · “~”는 최소 기준가</p></div>
      <div class="options" id="opts"></div>
    </section>

    <aside class="panel right">
      <div class="quoteHead"><div><h2>실시간 예상 견적</h2><div class="sub" id="summary"></div></div><div id="status" class="status"></div></div>
      <div class="hero"><small>VAT 포함 예상 총액</small><div id="grand" class="amount">0원</div><div id="heroNote" class="note"></div></div>
      <div id="breakdown" class="lines"></div>
      <div class="totals" id="totals"></div>
      <div class="approval"><b id="approvalTitle"></b><p id="approvalBody"></p></div>
      <div class="actions"><button id="reset" class="btn secondary">조건 초기화</button><button id="create" class="btn primary">1차 견적 생성</button></div>
      <div class="foot"><span>Beaulead 영상 제작 예상 견적</span><span>단가표 기준 · VAT 10% 별도</span></div>
    </aside>
  </div>
</div>
<div id="toast" class="toast">1차 견적 초안을 생성했습니다.</div>

<script src="pricing-config.js"></script>
<script src="calculator.js"></script>
<script>
// 화면 구성과 이벤트만 담당한다. 단가와 문구는 pricing-config.js, 계산은 calculator.js.
const config = window.VIDEO_QUOTE_CONFIG;
const calculator = window.VIDEO_QUOTE_CALCULATOR;
const won = n => Math.round(n).toLocaleString('ko-KR') + '원';
const num = n => n.toLocaleString('ko-KR');
const percent = rate => `${Math.round(rate * 1000) / 10}%`;
const el = id => document.getElementById(id);

const state = { quantities: {}, serviceLevel: config.defaultServiceLevel, options: {} };
config.durations.forEach(d => { state.quantities[d.id] = d.defaultQuantity; });
config.options.forEach(o => { state.options[o.id] = { on: false, quantity: 1 }; });

const levelOf = id => config.serviceLevels.find(l => l.id === id);
const priceOf = d => (d.usesServiceLevel ? levelOf(state.serviceLevel).price : d.price);

el('subtitle').textContent = config.sample.subtitle;
el('f-client').value = config.sample.client;
el('f-inquiry').value = config.sample.inquiryType;
el('f-stage').value = config.sample.stage;
el('reset').textContent = `${config.sample.client} 조건 초기화`;

// 상단 칩 — 같은 단가끼리 묶어 한 줄로 보여준다.
(function buildChips() {
  const chips = [];
  const grouped = new Map();
  config.durations.filter(d => !d.usesServiceLevel).forEach(d => {
    if (!grouped.has(d.price)) grouped.set(d.price, []);
    grouped.get(d.price).push(d.label);
  });
  grouped.forEach((labels, price) => chips.push(`<b>${labels.join(' · ')}</b> ${won(price)}/편`));
  config.durations.filter(d => d.usesServiceLevel).forEach(d => {
    const levels = config.serviceLevels.map(l => `${l.label} ${num(l.price)}`).join(' / ');
    chips.push(`<b>${d.label}</b> ${levels}`);
  });
  const volume = config.volumeDiscount;
  chips.push(`<b>${volume.minQuantity}편+</b> 기본제작비 ${percent(volume.rate)} 할인`);
  chips.push(`VAT ${percent(config.vatRate)} 별도`);
  el('chips').innerHTML = chips.map(text => `<div class="chip">${text}</div>`).join('');
})();

// 영상 길이 카드
config.durations.forEach(duration => {
  const card = document.createElement('div');
  card.className = 'svc';
  card.id = `c_${duration.id}`;
  card.innerHTML =
    `<div class="svcTop"><div><h3>${duration.label}</h3>` +
    `<div class="price" id="p_${duration.id}"></div>` +
    `<div class="meta">${duration.meta}</div></div>` +
    `<div class="qty" id="v_${duration.id}">${duration.defaultQuantity}</div></div>` +
    `<input id="q_${duration.id}" type="range" min="0" max="${config.maxQuantity}" value="${duration.defaultQuantity}" aria-label="${duration.label} 영상 수량">` +
    `<div class="range"><span>0편</span><span>${config.maxQuantity}편</span></div>`;
  el('services').appendChild(card);

  el(`q_${duration.id}`).oninput = event => {
    state.quantities[duration.id] = Number(event.target.value);
    render();
  };

  if (!duration.usesServiceLevel) return;

  const seg = document.createElement('div');
  seg.className = 'seg';
  config.serviceLevels.forEach(level => {
    const button = document.createElement('button');
    button.type = 'button';
    button.id = `lv_${level.id}`;
    button.textContent = level.segLabel;
    button.setAttribute('aria-pressed', String(level.id === state.serviceLevel));
    button.classList.toggle('on', level.id === state.serviceLevel);
    button.onclick = () => { state.serviceLevel = level.id; render(); };
    seg.appendChild(button);
  });
  card.appendChild(seg);

  if (duration.notice) {
    const notice = document.createElement('div');
    notice.className = 'notice';
    notice.id = `nt_${duration.id}`;
    notice.textContent = duration.notice;
    card.appendChild(notice);
  }
});

// 추가 옵션 — 토글은 role="switch" 버튼이라 Tab 으로 닿고 Space/Enter 로 켜진다.
config.options.forEach(option => {
  const card = document.createElement('div');
  card.className = 'opt';
  const priceText = `${won(option.price)}${option.approx ? '~' : ''}${option.note ? ' · ' + option.note : ''}`;
  card.innerHTML =
    `<div class="optTop"><div><div class="optName">${option.name}</div>` +
    `<div class="optPrice">${priceText}</div></div>` +
    `<button type="button" class="switch" id="sw_${option.id}" role="switch" aria-checked="false" aria-label="${option.name} 옵션 추가"></button></div>` +
    (option.unit
      ? `<div class="mini" id="mc_${option.id}"><span>추가 ${option.unit}</span>` +
        `<input id="n_${option.id}" type="number" min="1" value="1" aria-label="${option.name} ${option.unit} 수량"></div>`
      : '');
  el('opts').appendChild(card);

  el(`sw_${option.id}`).onclick = event => {
    const next = !state.options[option.id].on;
    state.options[option.id].on = next;
    event.currentTarget.classList.toggle('on', next);
    event.currentTarget.setAttribute('aria-checked', String(next));
    if (option.unit) el(`mc_${option.id}`).classList.toggle('show', next);
    render();
  };

  if (option.unit) {
    el(`n_${option.id}`).oninput = event => {
      state.options[option.id].quantity = Math.max(1, Number(event.target.value) || 1);
      render();
    };
  }
});

function render() {
  const result = calculator.calculate(state, config);
  const tilde = result.approximate ? '~' : '';

  config.durations.forEach(duration => {
    const quantity = state.quantities[duration.id];
    el(`v_${duration.id}`).textContent = quantity;
    el(`p_${duration.id}`).textContent = `${won(priceOf(duration))} / 편`;
    el(`c_${duration.id}`).classList.toggle('active', quantity > 0);
    const notice = el(`nt_${duration.id}`);
    if (notice) notice.classList.toggle('show', quantity > 0);
  });

  config.serviceLevels.forEach(level => {
    const button = el(`lv_${level.id}`);
    if (!button) return;
    const selected = level.id === state.serviceLevel;
    button.classList.toggle('on', selected);
    button.setAttribute('aria-pressed', String(selected));
  });

  el('breakdown').innerHTML = result.lines.length
    ? result.lines
        .map(line => `<div class="line"><span>${line.label}</span><strong>${won(line.amount)}${line.approx ? '~' : ''}</strong></div>`)
        .join('')
    : '<div class="line"><span>선택된 제작 항목 없음</span><strong>0원</strong></div>';

  el('totals').innerHTML = [
    `<div class="line"><span>기본 제작비</span><strong>${won(result.base)}</strong></div>`,
    `<div class="line disc"><span>${config.volumeDiscount.label}</span><strong>${result.discount ? '-' + won(result.discount) : '0원'}</strong></div>`,
    `<div class="line"><span>추가 옵션</span><strong>${won(result.optionTotal)}${tilde}</strong></div>`,
    `<div class="line"><span>공급가</span><strong>${won(result.supply)}${tilde}</strong></div>`,
    `<div class="line"><span>VAT ${percent(config.vatRate)}</span><strong>${won(result.vat)}${tilde}</strong></div>`,
    `<div class="line grand"><span><strong>최종 예상 견적</strong></span><strong>${won(result.total)}${tilde}</strong></div>`
  ].join('');

  el('grand').textContent = won(result.total) + tilde;
  el('heroNote').textContent = result.discountApplied
    ? config.volumeDiscount.appliedNote
    : config.volumeDiscount.pendingNote;
  el('summary').textContent = result.summary || '영상 수량을 선택하세요';

  el('status').className = `status ${result.state.tone}`;
  el('status').textContent = result.state.label;
  el('approvalTitle').textContent = result.state.title;
  el('approvalBody').textContent = result.state.body;
}

el('reset').onclick = () => {
  config.durations.forEach(duration => {
    state.quantities[duration.id] = duration.defaultQuantity;
    el(`q_${duration.id}`).value = duration.defaultQuantity;
  });
  state.serviceLevel = config.defaultServiceLevel;
  config.options.forEach(option => {
    state.options[option.id] = { on: false, quantity: 1 };
    const toggle = el(`sw_${option.id}`);
    toggle.classList.remove('on');
    toggle.setAttribute('aria-checked', 'false');
    if (option.unit) {
      el(`mc_${option.id}`).classList.remove('show');
      el(`n_${option.id}`).value = 1;
    }
  });
  render();
};

el('create').onclick = () => {
  const toast = el('toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2300);
};

render();
</script>
</body>
</html>
