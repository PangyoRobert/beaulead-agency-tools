  <script>
    (function renderPage() {
      const CONFIG = window.NAVER_BLOG_QUOTE_CONFIG;
      const won = new Intl.NumberFormat("ko-KR");
      const fmt = function (n) { return won.format(n) + "원"; };

      // 금액은 config 의 공급가에서만 파생한다. 부가세는 공급가 합계에 한 번 붙이고 원 단위 반올림한다.
      function vatOf(supply) { return Math.round(supply * CONFIG.vatRate); }

      // 화면 텍스트는 textContent 로만 그린다. 입력값은 저장하거나 밖으로 보내지 않는다.
      function element(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      // 비고에 보이는 문장은 옵션에서 파생한다. 같은 내용을 두 군데 적어 어긋나지 않게 한다.
      function remarks(c) {
        const lines = [];
        const o = c.options;
        if (o.highInvolvement) {
          lines.push(o.highInvolvement.label + " 진행 체험단 — " + (o.highInvolvement.unitPrice === null ? "별도 단가 (문의)" : fmt(o.highInvolvement.unitPrice)));
        }
        if (o.retrieval) lines.push(o.retrieval.label + "의 경우 단가 + " + fmt(o.retrieval.addPerPerson));
        if (o.clip) lines.push(o.clip.label + " 시 " + o.clip.note);
        return lines.concat(c.notes);
      }

      // ── 단가표 ──
      const table = document.getElementById("menu-table");
      const thead = element("thead");
      const headRow = element("tr");
      ["마케팅 캠페인", "구분", "단가 (VAT 별도)", "내용", "마케팅 목표", "비고"].forEach(function (h) {
        const th = element("th", null, h); th.setAttribute("scope", "col"); headRow.append(th);
      });
      thead.append(headRow);
      const tbody = element("tbody");
      CONFIG.campaigns.forEach(function (c) {
        const tr = element("tr");
        const name = element("th", null, c.name); name.setAttribute("scope", "row");
        const content = element("td"); c.content.forEach(function (line, i) { if (i) content.append(element("br")); content.append(element("span", null, line)); });
        const remarkCell = element("td");
        const rs = remarks(c);
        if (rs.length || c.restrictions.length) {
          const ol = element("ol");
          c.restrictions.forEach(function (r) { const li = element("li"); li.append(element("span", "restrict", r)); ol.append(li); });
          rs.forEach(function (r) { ol.append(element("li", null, r)); });
          remarkCell.append(ol);
        }
        tr.append(name, element("td", null, c.type), element("td", "price", c.unitPrice === null ? "개별 문의" : won.format(c.unitPrice)), content, element("td", null, c.goal), remarkCell);
        tbody.append(tr);
      });
      table.append(thead, tbody);

      // ── 계산기 ── (단가가 있는 캠페인만)
      const calc = document.getElementById("calc");
      const rows = [];
      CONFIG.campaigns.filter(function (c) { return c.unitPrice !== null; }).forEach(function (c) {
        const row = element("div", "calc-row");
        const name = element("div", "calc-name");
        name.append(element("strong", null, c.name), element("small", null, "1인 " + fmt(c.unitPrice)));

        const countLabel = element("label", "count", "인원");
        const count = element("input");
        count.type = "number"; count.min = "0"; count.max = String(CONFIG.maxCount); count.step = "1"; count.value = "0";
        count.inputMode = "numeric"; count.id = "count-" + c.id;
        countLabel.setAttribute("for", count.id);
        countLabel.append(count);

        const opts = element("div", "opts");
        const checks = {};
        ["highInvolvement", "retrieval", "clip"].forEach(function (key) {
          const opt = c.options[key];
          if (!opt) return;
          if (key === "highInvolvement" && opt.unitPrice === null) return; // 확인되지 않은 단가는 고르지 못하게 한다
          const label = element("label");
          const box = element("input"); box.type = "checkbox";
          label.append(box, element("span", null, opt.label));
          opts.append(label);
          checks[key] = box;
        });
        if (!opts.children.length) opts.append(element("span", null, c.restrictions.length ? "옵션 없음 (회수형 진행 불가)" : "옵션 없음"));

        const total = element("div", "line-total", fmt(0));
        row.append(name, countLabel, opts, total);
        calc.append(row);
        rows.push({ c: c, count: count, checks: checks, total: total });
      });

      function people(input) {
        const n = Math.floor(Number(input.value));
        if (!Number.isFinite(n) || n < 0) return 0;
        return Math.min(n, CONFIG.maxCount);
      }

      const totals = document.getElementById("totals");
      const flags = document.getElementById("flags");
      function line(label, value, cls) {
        const div = element("div", cls); div.append(element("span", null, label), element("span", null, value)); return div;
      }

      function update() {
        let supply = 0;
        const notes = [];
        rows.forEach(function (r) {
          const n = people(r.count);
          const o = r.c.options;
          let unit = r.checks.highInvolvement && r.checks.highInvolvement.checked ? o.highInvolvement.unitPrice : r.c.unitPrice;
          if (r.checks.retrieval && r.checks.retrieval.checked) unit += o.retrieval.addPerPerson;
          const amount = unit * n;
          supply += amount;
          r.total.textContent = fmt(amount);
          r.total.append(element("small", null, fmt(unit) + " × " + n + "명"));
          if (n > 0 && r.checks.clip && r.checks.clip.checked) notes.push(r.c.name + ": " + o.clip.label + " " + o.clip.note);
        });
        const vat = vatOf(supply);
        totals.replaceChildren(line("공급가 합계", fmt(supply)), line("부가세 (10%)", fmt(vat)), line("합계 (VAT 포함)", fmt(supply + vat), "grand"));
        flags.textContent = notes.join(" / ");
      }
      calc.addEventListener("input", update);
      calc.addEventListener("change", update);
      update();

      // ── 프로세스 ──
      const process = document.getElementById("process");
      CONFIG.process.forEach(function (p) {
        process.append(element("li", p.condition ? "cond" : null, p.condition ? p.step + " (" + p.condition + ")" : p.step));
      });
      document.getElementById("recruit").textContent = CONFIG.recruit;
    })();
  </script>
</body>
</html>
