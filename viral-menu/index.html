  <style>
    :root {
      color-scheme: light;
      --bg: var(--bl-surface-raised);
      --panel: var(--bl-surface-default);
      --panel-2: var(--bl-surface-raised);
      --line: var(--bl-rule-on-light);
      --text: var(--bl-text-default);
      --muted: var(--bl-text-body-on-light);
      --blue: var(--bl-brand-accent);
      --radius: 20px;
      --mono: var(--bl-font-mono);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; color: var(--text); font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); }
    a { color: inherit; }
    .color-bar { position: fixed; z-index: 40; top: 0; right: 0; left: 0; display: grid; grid-template-columns: repeat(4, 1fr); height: 4px; }
    .color-bar span { background: var(--blue); }
    .topbar { position: sticky; z-index: 30; top: 0; display: flex; min-height: 68px; padding: 14px max(20px, calc((100vw - 1360px) / 2)); align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); background: rgba(244, 244, 244, 0.92); backdrop-filter: blur(16px); }
    .brand { font-weight: 700; letter-spacing: -0.05em; text-decoration: none; }
    .brand::after { color: var(--blue); content: "."; }
    .back { color: var(--muted); font-size: 0.875rem; font-weight: 600; text-decoration: none; }
    .back:hover, .back:focus-visible { color: var(--text); }
    main { width: min(1360px, calc(100% - 40px)); margin: 0 auto; padding: 42px 0 72px; }
    .page-head { display: flex; justify-content: space-between; gap: 32px; margin-bottom: 30px; align-items: end; }
    .eyebrow { margin: 0 0 11px; color: var(--blue); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; font-family: var(--mono); }
    h1 { margin: 0; font-size: clamp(2.3rem, 5vw, 4.7rem); line-height: 0.96; letter-spacing: -0.065em; }
    .intro { max-width: 560px; margin: 14px 0 0; color: var(--muted); line-height: 1.6; word-break: keep-all; }
    .vat-pill { padding: 9px 13px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 0.8rem; white-space: nowrap; font-family: var(--mono); }
    .group { margin-top: 34px; }
    .group-title { margin: 0 0 4px; font-size: 1.3rem; letter-spacing: -0.03em; }
    .group-en { margin: 0 0 16px; color: var(--muted); font-size: 0.82rem; font-family: var(--mono); }
    .campaign-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .campaign { display: flex; flex-direction: column; gap: 14px; padding: clamp(22px, 2.4vw, 30px); border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
    .campaign-name { margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: -0.03em; }
    .campaign-en { margin: 3px 0 0; color: var(--muted); font-size: 0.78rem; font-family: var(--mono); }
    .campaign-body { margin: 0; color: var(--muted); font-size: 0.9rem; line-height: 1.65; word-break: keep-all; }
    .price-box { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); }
    .price-row { display: flex; gap: 14px; justify-content: space-between; align-items: baseline; padding: 6px 0; font-size: 0.9rem; }
    .price-row strong { font-family: var(--mono); font-weight: 700; text-align: right; }
    .price-row small { display: block; color: var(--muted); font-size: 0.78rem; font-family: var(--mono); font-weight: 400; }
    .price-detail { color: var(--muted); font-size: 0.8rem; }
    .price-ask { margin: 0; color: var(--muted); font-size: 0.88rem; }
    .detail-link { align-self: flex-start; color: var(--blue); font-size: 0.88rem; font-weight: 700; text-decoration: none; }
    .detail-link:hover, .detail-link:focus-visible { text-decoration: underline; }
    .footnote { margin: 34px 0 0; color: var(--muted); font-size: 0.82rem; line-height: 1.55; }
    @media (max-width: 860px) { .campaign-grid { grid-template-columns: 1fr; } }
    @media (max-width: 620px) { main { width: min(100% - 24px, 1360px); padding-top: 28px; } .page-head { display: block; } .vat-pill { display: inline-block; margin-top: 16px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; } }
    @media print {
      @page { margin: 14mm; }
      *, *::before, *::after { background: transparent !important; color: #241815 !important; border-color: #E0E0E0 !important; box-shadow: none !important; }
      html, body { background: #FFFFFF !important; }
      .color-bar, .topbar, .back { display: none !important; }
      main { width: 100%; padding: 0; }
      .campaign { break-inside: avoid; border-radius: 0; }
      .eyebrow { color: #0F62FE !important; }
    }

<body>
  <div class="color-bar" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <header class="topbar">
    <a class="brand" href="../">BEAULEAD</a>
    <a class="back" href="../#tools">← Agency Tools</a>
  </header>

  <main>
    <div class="page-head">
      <div>
        <p class="eyebrow">Viral Marketing Menu</p>
        <h1>바이럴 마케팅<br>서비스 메뉴</h1>
        <p class="intro">브랜드 목적에 맞는 채널을 골라 집행할 수 있도록 캠페인별 서비스와 단가를 한 장에 정리했습니다.</p>
      </div>
      <span class="vat-pill">VAT 10% 별도</span>
    </div>

    <div id="groups"></div>

    <p class="footnote">표기된 금액은 모두 공급가이며 부가세 10%가 별도로 부과됩니다. 문의는 <a href="mailto:robert@beaulead.co.kr">robert@beaulead.co.kr</a>로 주십시오.</p>
  </main>

  <script src="./pricing-config.js"></script>
  <script>
    (function renderPage() {
      const CONFIG = window.VIRAL_MENU_CONFIG;
      const won = new Intl.NumberFormat("ko-KR");

      // 금액은 config 의 공급가에서만 파생한다.
      function withVat(supplyPrice) {
        return Math.round(supplyPrice * (1 + CONFIG.vatRate));
      }

      function element(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function priceRow(item) {
        const row = element("div", "price-row");
        const label = element("span", null, item.label);
        if (item.detail) label.append(element("div", "price-detail", item.detail));
        const value = element("strong", null, won.format(item.supplyPrice) + "원" + (item.unit ? " / " + item.unit : ""));
        value.append(element("small", null, "VAT 포함 " + won.format(withVat(item.supplyPrice)) + "원"));
        row.append(label, value);
        return row;
      }

      const root = document.getElementById("groups");
      CONFIG.groups.forEach(function (group) {
        const section = element("section", "group");
        section.setAttribute("aria-labelledby", "g-" + group.id);
        const title = element("h2", "group-title", group.name);
        title.id = "g-" + group.id;
        section.append(title, element("p", "group-en", group.nameEn));

        const grid = element("div", "campaign-grid");
        group.campaigns.forEach(function (campaign) {
          const card = element("article", "campaign");
          const head = element("div");
          head.append(element("h3", "campaign-name", campaign.name), element("p", "campaign-en", campaign.nameEn));
          card.append(head);
          card.append(element("p", "campaign-body", campaign.summary.join(" ")));

          const box = element("div", "price-box");
          if (campaign.prices.length) {
            campaign.prices.forEach(function (item) { box.append(priceRow(item)); });
          } else {
            box.append(element("p", "price-ask", "단가 문의"));
          }
          card.append(box);
          // 하위 상세 페이지가 있으면 링크를 단다. 옛 설정이 캐시돼 detailUrl 이 없어도 링크만 빠지고 깨지지 않는다.
          if (campaign.detailUrl) {
            const link = element("a", "detail-link", campaign.detailLabel || "단가·견적 보기 →");
            link.href = campaign.detailUrl;
            card.append(link);
          }
          grid.append(card);
        });
        section.append(grid);
        root.append(section);
      });
    })();
  </script>
</body>
</html>
