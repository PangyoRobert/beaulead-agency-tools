<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>og-default</title>
<!-- 색·폰트는 brand-design-system/brands/beaulead/tokens.json 확정값.
     asset-rules.md "형태 금지" 에 따라 그라디언트 · box-shadow · border-radius 없음. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    width: 1200px;
    height: 630px;
    padding: 80px;
    background: #FFFFFF;
    color: #241815;
    font-family: Pretendard, sans-serif;
  }
  .bar { flex-shrink: 0; width: 120px; height: 8px; background: #0F62FE; }
  .body { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; }
  /* flex 컨테이너의 기본 align-items:stretch 가 width:auto 를 이겨 가로로 늘린다.
     로고 왜곡은 asset-rules "기울임·변형 금지" 위반이라 교차축 정렬을 고정한다. */
  img { display: block; align-self: flex-start; height: 64px; width: auto; }
  h1 {
    margin: 36px 0 0;
    font-size: 72px;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.03em;
    word-break: keep-all;
  }
  p {
    max-width: 880px;
    margin: 24px 0 0;
    color: #525252;
    font-size: 28px;
    font-weight: 400;
    line-height: 1.5;
    word-break: keep-all;
  }
  footer {
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    padding-top: 24px;
    border-top: 1px solid #E0E0E0;
    color: #525252;
    font-family: "IBM Plex Mono", monospace;
    font-size: 22px;
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="body">
    <img src="wordmark.png" alt="BEAULEAD">
    <h1>에이전시 견적 · 플래닝 도구</h1>
    <p>영상 제작, 개발, Google Ads 교육, 크리에이터 제휴 견적을 조건에 맞춰 실시간으로 계산합니다.</p>
  </div>
  <footer>
    <span>PERFORMANCE MARKETING</span>
    <span>pangyorobert.github.io/beaulead-agency-tools</span>
  </footer>
</body>
</html>
